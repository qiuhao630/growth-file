        +   '<div class="field"><label>单位</label>'
        +     '<input type="text" name="unit" value="' + esc(it && it.unit ? it.unit : '件') + '"></div>'
        + '</div>'
        + '<div class="field"><label>低库存提醒阈值</label>'
        +   '<input type="number" name="threshold" step="0.1" min="0" value="' + esc(it && it.threshold != null ? it.threshold : 5) + '">'
        +   '<div class="hint">剩余数量 ≤ 该数值时会在首页提醒</div></div>'
        + '<div class="field"><label>备注</label>'
        +   '<textarea name="notes">' + esc(it ? it.notes || '' : '') + '</textarea></div>',
      onSubmit: function(data){
        if(!(data.name || '').trim()){ toast('请填写物品名称'); return false; }
        var rec = {
          id: it ? it.id : uid(), babyId: state.babyId,
          name: data.name.trim(), category: data.category,
          quantity: data.quantity === '' ? 0 : +data.quantity,
          unit: (data.unit || '件').trim(),
          threshold: data.threshold === '' ? 0 : +data.threshold,
          notes: (data.notes || '').trim(),
          createdAt: it ? it.createdAt : Date.now(),
          updatedAt: Date.now()
        };
        return dbPut('inventory', rec).then(function(){
          toast(it ? '已保存修改' : '库存已添加');
          render();
          if(syncState.enabled && syncState.autoSync) syncNow(true);
        });
      }
    });
    setTimeout(function(){ bindChipsInModal(m.el); }, 0);
  });
}

function viewDiary(){
  return Promise.all([
    dbByBaby('diary', state.babyId),
    dbByBaby('album', state.babyId)
  ]).then(function(res){
    var list = res[0]; var albumAll = res[1];
    list.sort(function(a, b){
      return (b.recordedAt || '').localeCompare(a.recordedAt || '') || b.createdAt - a.createdAt;
    });
    var albumMap = {};
    albumAll.forEach(function(a){ albumMap[a.id] = a; });
    var blocks = list.map(function(d){
      return '<div class="card" data-diary-id="' + d.id + '">'
        + '<div style="display:flex;align-items:flex-start;gap:10px">'
        +   '<div style="flex:1;min-width:0">'
        +     '<div style="font-size:14.5px;font-weight:700;color:var(--text);margin-bottom:3px">' + esc(d.title || '日记') + '</div>'
        +     '<div style="font-size:11.5px;color:var(--text-l)">' + esc(fmtDate(d.recordedAt)) + '</div>'
        +   '</div>'
        +   '<div style="display:flex;gap:6px">'
        +     '<button class="icon-btn" onclick="editDiary(\'' + d.id + '\')">✎</button>'
        +     '<button class="icon-btn del" onclick="delRecord(\'diary\',\'' + d.id + '\')">🗑</button>'
        +   '</div>'
        + '</div>'
        + '<div style="font-size:14px;color:var(--text);line-height:1.7;margin-top:9px;white-space:pre-wrap;word-break:break-word">' + esc(d.content) + '</div>'
        + '<div class="diary-thumbs" data-ids="' + (d.albumIds || []).join(',') + '"></div>'
        + '</div>';
    }).join('');
    setTimeout(function(){
      list.forEach(function(d){
        var albumIds = d.albumIds || [];
        if(!albumIds.length) return;
        var wrap = document.querySelector('.diary-thumbs[data-ids="' + albumIds.join(',') + '"]');
        if(!wrap) return;
        var chain = Promise.resolve('');
        albumIds.slice(0, 6).forEach(function(aid){
          chain = chain.then(function(acc){
            var meta = albumMap[aid];
            if(!meta) return acc;
            return dbGet('albumFiles', aid).then(function(fr){
              if(!fr) return acc;
              var u = URL.createObjectURL(fr.blob);
              state.objectURLs.push(u);
              var mediaHtml = meta.mediaType === 'video'
                ? '<video src="' + u + '" muted style="width:100%;height:100%;object-fit:cover"></video>'
                : '<img src="' + u + '" style="width:100%;height:100%;object-fit:cover">';
              return acc + '<div style="width:52px;height:52px;border-radius:10px;overflow:hidden;background:#F3E8D4">' + mediaHtml + '</div>';
            });
          });
        });
        chain.then(function(html){
          if(html) wrap.innerHTML = '<div style="display:flex;gap:6px;margin-top:9px;flex-wrap:wrap">' + html + '</div>';
        });
      });
    }, 0);
    return ''
      + '<div class="page-head">'
      +   '<h1>宝宝日记<span class="sub">共 ' + list.length + ' 篇</span></h1>'
      +   '<button class="btn-primary" onclick="editDiary()">＋ 写日记</button>'
      + '</div>'
      + (list.length === 0
          ? '<div class="empty"><span class="ico">📔</span><p>还没有日记<br>记录下今天宝宝的可爱瞬间吧</p></div>'
          : blocks);
  });
}
function editDiary(id){
  Promise.all([
    id ? dbGet('diary', id) : Promise.resolve(null),
    dbByBaby('album', state.babyId)
  ]).then(function(res){
    var d = res[0]; var albumAll = res[1];
    albumAll.sort(function(a, b){ return b.createdAt - a.createdAt; });
    var selected = {};
    (d && d.albumIds ? d.albumIds : []).forEach(function(x){ selected[x] = true; });
    var pickerHtml = '';
    if(albumAll.length === 0){
      pickerHtml = '<div class="hint">相册中还没有内容，可先到「云相册」上传照片或视频。</div>';
    }else{
      pickerHtml = '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:200px;overflow-y:auto;padding:4px;background:var(--bg);border-radius:12px" id="diaryPicker">'
        + albumAll.map(function(a){
            return '<div class="dp-cell" data-id="' + a.id + '" style="position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#EDE0C8;border:2.5px solid '
              + (selected[a.id] ? '#C89B6A' : 'transparent') + ';cursor:pointer">'
              + '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:20px">'
              + (a.mediaType === 'video' ? '🎬' : '🖼') + '</div>'
              + (selected[a.id] ? '<div class="dp-badge" style="position:absolute;right:3px;top:3px;background:#C89B6A;color:#fff;width:17px;height:17px;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center">✓</div>' : '')
              + '</div>';
          }).join('')
        + '</div><div class="hint">点击选择要关联的照片 / 视频（最多 9 个）</div>';
    }
    var m = showModal({
      title: d ? '编辑日记' : '写日记',
      submitText: d ? '保存修改' : '保存日记',
      body: ''
        + '<div class="field"><label>标题</label>'
        +   '<input type="text" name="title" value="' + esc(d ? d.title || '' : '') + '" placeholder="例如 今天会翻身啦"></div>'
        + '<div class="field"><label>日期 *</label>'
        +   '<input type="date" name="recordedAt" required value="' + esc(d && d.recordedAt ? d.recordedAt : todayStr()) + '"></div>'
        + '<div class="field"><label>内容 *</label>'
        +   '<textarea name="content" required style="min-height:130px" placeholder="今天宝宝…">' + esc(d ? d.content || '' : '') + '</textarea></div>'
        + '<div class="field"><label>关联相册（可选）</label>' + pickerHtml + '</div>',
      onSubmit: function(data, mask){
        if(!(data.content || '').trim()){ toast('请填写日记内容'); return false; }
        var picked = Array.prototype.slice.call(mask.querySelectorAll('.dp-cell.sel')).map(function(c){ return c.getAttribute('data-id'); });
        var rec = {
          id: d ? d.id : uid(), babyId: state.babyId,
          title: (data.title || '').trim(), content: data.content.trim(),
          recordedAt: data.recordedAt, albumIds: picked,
          createdAt: d ? d.createdAt : Date.now()
        };
        return dbPut('diary', rec).then(function(){
          toast(d ? '已保存修改' : '日记已保存 📔');
          render();
          if(syncState.enabled && syncState.autoSync) syncNow(true);
        });
      }
    });
    setTimeout(function(){
      var picker = m.el.querySelector('#diaryPicker');
      if(!picker) return;
      picker.querySelectorAll('.dp-cell').forEach(function(cell){
        cell.onclick = function(){
          var isSel = cell.classList.toggle('sel');
          var cnt = picker.querySelectorAll('.dp-cell.sel').length;
          if(isSel && cnt > 9){ cell.classList.remove('sel'); toast('最多关联 9 个媒体文件'); return; }
          cell.style.borderColor = cell.classList.contains('sel') ? '#C89B6A' : 'transparent';
          var badge = cell.querySelector('.dp-badge');
          if(cell.classList.contains('sel') && !badge){
            var b = document.createElement('div');
            b.className = 'dp-badge';
            b.style.cssText = 'position:absolute;right:3px;top:3px;background:#C89B6A;color:#fff;width:17px;height:17px;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center';
            b.textContent = '✓';
            cell.appendChild(b);
          }else if(!cell.classList.contains('sel') && badge){
            badge.parentNode.removeChild(badge);
          }
        };
      });
    }, 0);
  });
}

/* ===================================================================
   通用：删除 / chips / 导入导出
   =================================================================== */
function delRecord(store, id){
  var nameMap = {
    feeding:'喂养记录', growth:'身高体重', vaccine:'疫苗记录', medical:'医疗记录',
    inventory:'库存记录', montessori:'蒙氏工作', motor:'运动训练', diary:'日记'
  };
  var storeName = nameMap[store] || '记录';
  confirmDialog('确定删除这条' + storeName + '吗？删除后无法恢复。', function(){
    return dbDel(store, id).then(function(){
      toast('已删除');
      render();
      if(syncState.enabled && syncState.autoSync) syncNow(true);
    });
  });
}
function bindChipsInModal(mask){
  if(!mask) return;
  mask.querySelectorAll('.chips').forEach(function(group){
    var hidden = group.parentElement.querySelector('input[type=hidden]');
    if(!hidden) return;
    group.querySelectorAll('.chip').forEach(function(c){
      c.onclick = function(){
        group.querySelectorAll('.chip').forEach(function(x){ x.classList.remove('sel'); });
        c.classList.add('sel');
        hidden.value = c.getAttribute('data-v');
      };
    });
  });
}
function exportData(){
  var data = {};
  var chain = Promise.resolve();
  STORES.forEach(function(s){
    if(s === 'albumFiles') return;
    chain = chain.then(function(){ return dbAll(s).then(function(rows){ data[s] = rows; }); });
  });
  chain.then(function(){
    data._meta = { exportedAt: new Date().toISOString(), version: DB_VER, app: '成长记录档案' };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = '成长记录档案备份_' + todayStr() + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
    setLastBackup();
    toast('备份文件已导出（不含照片视频）✅');
  }).catch(function(e){ toast('导出失败：' + e.message); });
}
function importData(){
  var input = document.createElement('input');
  input.type = 'file'; input.accept = 'application/json,.json';
  input.onchange = function(){
    var f = input.files[0];
    if(!f) return;
    f.text().then(function(text){
      var data = JSON.parse(text);
      if(!confirm('导入将合并到现有数据中（相同 ID 会覆盖）。确定继续吗？')) return;
      var chain = Promise.resolve();
      STORES.forEach(function(s){
        if(s === 'albumFiles' || !data[s] || !data[s].length) return;
        chain = chain.then(function(){
          var sub = Promise.resolve();
          data[s].forEach(function(rec){ sub = sub.then(function(){ return dbPut(s, rec); }); });
          return sub;
        });
      });
      return chain.then(function(){
        toast('数据导入完成 ✅');
        return dbAll('babies').then(function(babies){
          if(babies.length){ state.baby = babies[0]; state.babyId = babies[0].id; }
          render();
          if(syncState.enabled && syncState.autoSync) syncNow(true);
        });
      });
    }).catch(function(e){ alert('导入失败：文件格式不正确或已损坏。\n' + e.message); });
  };
  input.click();
}
function clearAllData(){
  confirmDialog('这将清空本机保存的全部记录（含相册媒体文件），且无法恢复。确定继续吗？', function(){
    var chain = Promise.resolve();
    STORES.forEach(function(s){ chain = chain.then(function(){ return dbClear(s); }); });
    return chain.then(function(){
      state.baby = null; state.babyId = null;
      try{ localStorage.removeItem(BACKUP_KEY); }catch(e){}
      toast('已清空全部数据');
      state.route = 'profile';
      try{ if(history && history.replaceState) history.replaceState(null, '', '#profile'); }catch(e){}
      render();
    });
  });
}

/* ===================================================================
   启动
   =================================================================== */
function onHashChange(){
  var hash = location.hash || '';
  var route = hash.replace(/^#/, '') || 'home';
  var exists = false;
  for(var i = 0; i < ROUTES.length; i++){
    if(ROUTES[i].id === route){ exists = true; break; }
  }
  if(!exists) route = 'home';
  if(!state.baby && route !== 'profile') route = 'profile';
  state.route = route;
  render();
}
function showFatalError(msg, line){
  var el = document.getElementById('content');
  if(el && !el.innerHTML.trim()){
    el.innerHTML = ''
      + '<div style="padding:24px;color:#C0654F;font-size:14px;line-height:1.9">'
      + '<b style="font-size:16px">⚠️ 页面初始化遇到问题</b><br><br>'
      + '错误：' + esc(msg) + (line ? '<br>位置：第 ' + line + ' 行' : '') + '<br><br>'
      + '<b>建议：</b><br>1. 优先使用 <b>Safari 浏览器</b>打开<br>'
      + '2. 检查是否开启了无痕 / 隐私模式<br>3. 清除浏览器缓存后重新打开'
      + '</div>';
  }
}
function init(){
  window.onerror = function(msg, url, line){
    console.error('全局错误:', msg, line);
    showFatalError(msg, line);
  };
  loadSyncConfig();
  var theme = loadTheme();
  var btn = $('#themeToggle');
  if(btn) btn.textContent = theme === 'night' ? '☀️' : '🌙';
  bindGlobalEvents();
  window.addEventListener('hashchange', onHashChange);
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'hidden') flushMirrors();
  });
  window.addEventListener('pagehide', flushMirrors);
  window.addEventListener('blur', flushMirrors);

  var hash = location.hash || '';
  var route = hash.replace(/^#/, '') || 'home';
  var exists = false;
  for(var i = 0; i < ROUTES.length; i++){
    if(ROUTES[i].id === route){ exists = true; break; }
  }
  if(!exists) route = 'home';
  state.route = route;
  render();
  requestPersistentStorage();

  openDB().then(function(db){
    if(!db){
      try{
        var warn = document.createElement('div');
        warn.style.cssText =
          'position:fixed;top:0;left:0;right:0;z-index:999;'
          + 'background:#FFF3CD;color:#856404;padding:10px 14px;'
          + 'padding-top:calc(10px + env(safe-area-inset-top));'
          + 'font-size:12px;line-height:1.6;text-align:center;'
          + 'border-bottom:1px solid #FFE69C;';
        warn.innerHTML = '⚠️ 当前浏览器限制了本地数据库，已切换为「本地存储 + 内存」模式。<br>建议使用 <b>Safari 浏览器</b> 打开。';
        document.body.appendChild(warn);
      }catch(e){}
    }
    return dbAll('babies').then(function(babies){
      if(babies && babies.length){
        state.baby = babies[0]; state.babyId = babies[0].id;
      }
      state.dbReady = true;
      if(!state.baby && state.route !== 'profile'){
        state.route = 'profile';
        try{ if(history && history.replaceState) history.replaceState(null, '', '#profile'); }catch(e){}
      }
      render();
      /* 启动后延迟自动同步 */
      if(syncState.enabled && syncState.autoSync){
        setTimeout(function(){ syncNow(true); }, 1500);
      }
    });
  }).catch(function(e){
    console.error('初始化异常:', e);
  });

  window.addEventListener('resize', function(){
    if(state.route === 'growth') requestAnimationFrame(function(){ drawGrowthChart(); });
    if(state.route === 'feeding') requestAnimationFrame(function(){ drawFeedChart(); });
  });
  window.addEventListener('orientationchange', function(){
    setTimeout(function(){ render(); }, 300);
  });
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
}else{
  init();
}
</script>
