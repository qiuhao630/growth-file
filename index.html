<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="成长记录档案">
<meta name="theme-color" content="#F5E6C8">
<meta name="format-detection" content="telephone=no">
<title>成长记录档案</title>
<style>
:root{
  --bg:#FDF6E3; --card:#FFFCF5; --primary:#C89B6A; --primary-d:#A87B4A;
  --accent:#E8C4A0; --text:#5A4A3A; --text-l:#8B7A66; --border:#EADFC8;
  --shadow:0 2px 10px rgba(180,150,110,.10);
  --shadow-l:0 6px 24px rgba(180,150,110,.16);
  --r:16px;
}
body.night{
  --bg:#1E1B17; --card:#2A2620; --primary:#D4A876; --primary-d:#E8C4A0;
  --accent:#8B6F47; --text:#E8DCC8; --text-l:#A89179; --border:#3D362C;
  --shadow:0 2px 10px rgba(0,0,0,.3);
  --shadow-l:0 6px 24px rgba(0,0,0,.4);
}
body.night .sidebar{background:linear-gradient(175deg,#25211B 0%,#1A1713 100%);}
body.night .topbar{background:linear-gradient(180deg,#2A2620,#25211B);}
body.night .brand-logo{background:linear-gradient(140deg,#3D362C,#2A2620);}
body.night .avatar{background:linear-gradient(140deg,#3D362C,#2A2620);}
body.night .hero{background:linear-gradient(135deg,#2A2620 0%,#25211B 55%,#1E1B17 100%);border-color:#3D362C;}
body.night .badge{background:rgba(255,255,255,.08);}
body.night .nav-item.active{background:linear-gradient(120deg,#3D362C,#2A2620);}
body.night .nav-icon{background:linear-gradient(140deg,#3D362C,#2A2620);}
body.night .nav-item.active .nav-icon{background:linear-gradient(140deg,#8B6F47,#6B543C);}
body.night .field input,body.night .field textarea,body.night .field select{background:#25211B;color:var(--text);}
body.night .chip{background:#25211B;border-color:#3D362C;color:var(--text-l);}
body.night .chip.sel{background:linear-gradient(135deg,#8B6F47,#6B543C);}
body.night .modal{background:#2A2620;}
body.night .modal-head{border-color:#3D362C;}
body.night .modal-foot{border-color:#3D362C;}
body.night .modal-close{background:#3D362C;color:#A89179;}
body.night .btn-ghost{background:#3D362C;border-color:#4D4538;color:var(--accent);}
body.night .btn-danger{background:#3D2620;color:#E8A090;}
body.night .icon-btn{background:#3D362C;color:var(--accent);}
body.night .icon-btn.del{background:#3D2620;color:#E8A090;}
body.night .item-ico{background:linear-gradient(140deg,#3D362C,#2A2620);}
body.night .stat{background:var(--card);border-color:#3D362C;}
body.night .chart-wrap{background:var(--card);}
body.night .seg{background:#25211B;}
body.night .seg button.sel{background:#3D362C;color:var(--accent);}
body.night .reminder.vaccine{background:linear-gradient(120deg,#1E2A1A,#162014);color:#8FAE7E;}
body.night .reminder.stock{background:linear-gradient(120deg,#2A1E1A,#201614);color:#D98B7A;}
body.night .reminder.safe{background:linear-gradient(120deg,#1A1E2A,#14161E);color:#8FA0BE;}
body.night .disclaimer{background:#25211B;border-color:#3D362C;color:#8B7A66;}
body.night .modal-mask{background:rgba(0,0,0,.6);}
body.night .upload-panel{background:#2A2620;border-color:#3D362C;}
body.night .up-bar{background:#3D362C;}
body.night .tag.done{background:#1E2A1A;color:#8FAE7E;}
body.night .tag.pending{background:#2A2418;color:#D4A876;}
body.night .tag.low{background:#2A1E1A;color:#D98B7A;}
body.night .tag.ok{background:#1E2A1A;color:#8FAE7E;}
body.night .tag.skipped{background:#25211B;color:#8B7A66;}
body.night .stat-row{border-color:#3D362C;}
body.night .legend{color:var(--text-l);}
body.night .page-head h1{color:var(--text);}
body.night .card-title{color:var(--text);}
body.night .hero-name{color:var(--text);}
body.night .hero-sub{color:var(--text-l);}
body.night .stat-val{color:var(--text);}
body.night .item-title{color:var(--text);}
body.night .seg button{color:var(--text-l);}
body.night .brand-txt h1{color:var(--text);}
body.night .brand-txt p{color:var(--text-l);}
body.night .nav-item{color:var(--text-l);}
body.night .nav-item.active{color:var(--accent);}
body.night .empty{color:var(--text-l);}
body.night .hint{color:var(--text-l);}
body.night .reminder b{color:var(--text);}
body.night .album-cell{background:#3D362C;}
body.night .dp-cell{background:#3D362C;border-color:#4D4538;}
body.night .dp-cell.sel{border-color:var(--accent);}
body.night .feed-stat-card{background:#2A2620;border-color:#3D362C;}
body.night .food-card{background:#2A2620;border-color:#3D362C;}
body.night .food-tag{background:#3D362C;color:var(--text-l);}
body.night .baby-food-icon{background:#3D362C;}
body.night .chart-type-btn{background:#3D362C;color:var(--text-l);}
body.night .chart-type-btn.sel{background:var(--primary);color:#1E1B17;}
body.night .summary-chip{background:#2A2620;border-color:#3D362C;}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;min-height:100vh;width:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased; overflow:hidden;
  transition:background .3s,color .3s;
}
input,select,textarea,button{font-family:inherit;font-size:16px;}
button{cursor:pointer;border:none;background:none;color:inherit;}
a{color:inherit;text-decoration:none;}

#app{display:flex;height:100vh;height:100dvh;min-height:100vh;overflow:hidden;}

.sidebar{
  width:224px;flex:0 0 224px;
  background:linear-gradient(175deg,#FFF8E9 0%,#F7E9CE 100%);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow-y:auto;
  padding-top: constant(safe-area-inset-top);
  padding-top: env(safe-area-inset-top);
  padding-bottom: constant(safe-area-inset-bottom);
  padding-bottom: env(safe-area-inset-bottom);
  -webkit-overflow-scrolling:touch;
  transition:background .3s;
}
.brand{padding:18px 16px 12px;display:flex;align-items:center;gap:10px;}
.brand-logo{
  width:38px;height:38px;border-radius:12px;flex:0 0 38px;
  background:linear-gradient(140deg,#F3D9AE,#DDB185);
  display:flex;align-items:center;justify-content:center;font-size:20px;
  box-shadow:0 2px 8px rgba(180,140,90,.25);
}
.brand-txt h1{margin:0;font-size:14px;font-weight:700;color:#6B543C;}
.brand-txt p{margin:1px 0 0;font-size:11px;color:var(--text-l);}
.nav{padding:6px 10px 20px;display:flex;flex-direction:column;gap:3px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;
  color:#6B543C;font-size:14px;transition:background .16s;
}
.nav-item.active{
  background:linear-gradient(120deg,#FFFFFF,#FFF3DE);
  box-shadow:0 2px 10px rgba(190,155,110,.18);
  font-weight:600;color:var(--primary-d);
}
.nav-icon{
  width:28px;height:28px;flex:0 0 28px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;font-size:15px;
  background:linear-gradient(140deg,#FBEFD9,#F0DDBE);
}
.nav-item.active .nav-icon{background:linear-gradient(140deg,#F5D9A8,#E4BC85);}

.main{
  flex:1;display:flex;flex-direction:column;min-width:0;position:relative;
  padding-top: constant(safe-area-inset-top);
  padding-top: env(safe-area-inset-top);
  background:var(--bg);
  transition:background .3s;
}
.topbar{
  display:none;align-items:center;gap:10px;padding:10px 14px;
  background:linear-gradient(180deg,#FDF3E0,#FBF0DA);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:20;
}
.topbar h2{margin:0;font-size:16px;font-weight:700;flex:1;color:#6B543C;}
.hamburger{
  width:36px;height:36px;border-radius:11px;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:17px;
  box-shadow:var(--shadow);
}
.theme-toggle{
  width:36px;height:36px;border-radius:11px;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:17px;
  box-shadow:var(--shadow);flex:0 0 auto;
}
.content{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 14px 40px;
  padding-bottom: calc(40px + constant(safe-area-inset-bottom));
  padding-bottom: calc(40px + env(safe-area-inset-bottom));
}
@media (max-width:820px){
  .sidebar{
    position:fixed;top:0;left:0;bottom:0;z-index:120;
    transform:translateX(-102%);transition:transform .26s;
    box-shadow:4px 0 24px rgba(120,90,50,.16);
    padding-top: constant(safe-area-inset-top);
    padding-top: env(safe-area-inset-top);
  }
  .sidebar.open{transform:translateX(0);}
  .topbar{display:flex;}
  .mask{
    position:fixed;inset:0;background:rgba(90,70,45,.35);z-index:110;
    opacity:0;pointer-events:none;transition:opacity .26s;
  }
  .mask.show{opacity:1;pointer-events:auto;}
}

.page-head{display:flex;align-items:center;gap:10px;margin:0 0 14px;}
.page-head h1{margin:0;font-size:19px;font-weight:700;color:#6B543C;flex:1;}
.page-head .sub{font-size:12px;color:var(--text-l);display:block;font-weight:400;margin-top:2px;}

.btn-primary{
  background:linear-gradient(135deg,#D9AE7B,#C08F5C);color:#fff;
  border-radius:12px;padding:9px 16px;font-size:14px;font-weight:600;
  box-shadow:0 3px 10px rgba(180,140,90,.30);white-space:nowrap;
}
.btn-ghost{
  background:#FFF6E6;color:var(--primary-d);border-radius:12px;
  padding:9px 16px;font-size:14px;font-weight:600;border:1px solid var(--border);
}
.btn-danger{background:#FBEDE9;color:#C0654F;border-radius:12px;padding:9px 16px;font-size:14px;font-weight:600;}
.btn-sm{padding:6px 11px;font-size:13px;border-radius:9px;}

.card{
  background:var(--card);border-radius:var(--r);padding:14px;
  box-shadow:var(--shadow);border:1px solid rgba(234,223,200,.7);
  margin-bottom:12px;
  transition:background .3s;
}
.card-title{font-size:14px;font-weight:700;color:#6B543C;margin:0 0 10px;}

.empty{text-align:center;padding:44px 20px;color:#B9A88F;}
.empty .ico{font-size:44px;display:block;margin-bottom:10px;opacity:.75;}
.empty p{margin:0;font-size:14px;}

.item{
  display:flex;gap:12px;align-items:flex-start;padding:12px;
  background:var(--card);border-radius:14px;margin-bottom:9px;
  box-shadow:var(--shadow);border:1px solid rgba(234,223,200,.6);
  transition:background .3s;
}
.item-ico{
  width:40px;height:40px;flex:0 0 40px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:19px;
  background:linear-gradient(140deg,#FBEFD9,#F2DFC0);
}
.item-body{flex:1;min-width:0;}
.item-title{font-weight:600;font-size:14.5px;color:#5A4A3A;margin:0 0 3px;word-break:break-all;}
.item-meta{font-size:12.5px;color:var(--text-l);margin:0;word-break:break-all;}
.item-actions{display:flex;flex-direction:column;gap:6px;flex:0 0 auto;}
.icon-btn{
  width:30px;height:30px;border-radius:9px;background:#FFF4E2;
  display:flex;align-items:center;justify-content:center;font-size:13px;
  color:var(--primary-d);
}
.icon-btn.del{background:#FBEDE9;color:#C0654F;}

.field{margin-bottom:13px;}
.field label{display:block;font-size:13px;font-weight:600;color:#7A6650;margin-bottom:6px;}
.field input[type=text],.field input[type=number],.field input[type=date],
.field input[type=time],.field input[type=datetime-local],.field select,.field textarea{
  width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--border);
  background:#FFFDF8;color:var(--text);outline:none;font-size:16px;
  transition:background .3s,color .3s,border-color .3s;
}
.field textarea{min-height:88px;resize:vertical;line-height:1.55;}
.field-row{display:flex;gap:10px;}
.field-row>.field{flex:1;margin-bottom:0;}

.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  padding:8px 14px;border-radius:20px;background:#FFF6E6;border:1.5px solid var(--border);
  font-size:13.5px;color:#7A6650;font-weight:500;transition:all .16s;
}
.chip.sel{background:linear-gradient(135deg,#E9C79B,#D4A876);color:#fff;border-color:transparent;}

.modal-mask{
  position:fixed;inset:0;background:rgba(80,60,40,.4);z-index:300;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;transition:opacity .22s;
}
.modal-mask.show{opacity:1;}
@media(min-width:821px){.modal-mask{align-items:center;}}
.modal{
  width:100%;max-width:520px;max-height:88vh;background:#FFFCF5;
  border-radius:22px 22px 0 0;display:flex;flex-direction:column;
  transform:translateY(28px);transition:transform .26s;
  box-shadow:0 -8px 40px rgba(120,90,50,.2);
  padding-bottom: constant(safe-area-inset-bottom);
  padding-bottom: env(safe-area-inset-bottom);
}
.modal-mask.show .modal{transform:translateY(0);}
@media(min-width:821px){.modal{border-radius:22px;}}
.modal-head{
  display:flex;align-items:center;padding:16px 18px 10px;gap:10px;
  border-bottom:1px solid #F3E8D4;
}
.modal-head h3{margin:0;font-size:16px;font-weight:700;flex:1;color:#6B543C;}
.modal-close{width:32px;height:32px;border-radius:10px;background:#FFF3E0;color:#A08560;font-size:15px;display:flex;align-items:center;justify-content:center;}
.modal-body{padding:16px 18px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;}
.modal-foot{
  display:flex;gap:10px;padding:12px 18px 16px;
  border-top:1px solid #F3E8D4;
  padding-bottom: calc(16px + constant(safe-area-inset-bottom));
  padding-bottom: calc(16px + env(safe-area-inset-bottom));
}
.modal-foot button{flex:1;padding:13px;border-radius:14px;font-size:15px;}

.hero{
  background:linear-gradient(135deg,#FFF6E3 0%,#F7E6C8 55%,#F0D9B4 100%);
  border-radius:20px;padding:18px;margin-bottom:14px;
  box-shadow:var(--shadow-l);position:relative;overflow:hidden;
  border:1px solid rgba(255,255,255,.7);
}
.hero-top{display:flex;align-items:center;gap:13px;}
.avatar{
  width:56px;height:56px;flex:0 0 56px;border-radius:18px;
  background:linear-gradient(140deg,#FBE4BE,#EBC89B);
  display:flex;align-items:center;justify-content:center;font-size:28px;
  box-shadow:0 4px 14px rgba(180,140,90,.25);overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover;}
.hero-name{font-size:19px;font-weight:700;color:#6B543C;margin:0 0 3px;}
.hero-sub{font-size:12.5px;color:#8B7A66;margin:0;}
.hero-badges{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.badge{
  background:rgba(255,255,255,.75);border-radius:11px;padding:6px 12px;
  font-size:12.5px;color:#7A6650;font-weight:600;
}
.badge b{color:var(--primary-d);font-size:14px;}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.stat{
  background:var(--card);border-radius:15px;padding:13px;
  box-shadow:var(--shadow);border:1px solid rgba(234,223,200,.65);
  display:flex;flex-direction:column;gap:4px;
}
.stat-top{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-l);}
.stat-top span:first-child{font-size:16px;}
.stat-val{font-size:19px;font-weight:700;color:#6B543C;}
.stat-val small{font-size:12px;font-weight:500;color:var(--text-l);margin-left:2px;}

.reminder{
  display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;
  margin-bottom:10px;font-size:13.5px;font-weight:500;
}
.reminder.vaccine{background:linear-gradient(120deg,#EAF3E6,#DEEBD8);color:#5B7A4E;}
.reminder.stock{background:linear-gradient(120deg,#FDEDE7,#F9E0D6);color:#B05F4A;}
.reminder.safe{background:linear-gradient(120deg,#E9F0F6,#DCE9F3);color:#4A6E8A;}
.reminder .r-ico{font-size:19px;}

.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.quick{
  background:var(--card);border-radius:15px;padding:14px 8px;
  display:flex;flex-direction:column;align-items:center;gap:7px;
  box-shadow:var(--shadow);border:1px solid rgba(234,223,200,.65);
}
.quick .q-ico{
  width:42px;height:42px;border-radius:14px;display:flex;align-items:center;
  justify-content:center;font-size:20px;
}
.quick .q-txt{font-size:12px;color:#7A6650;font-weight:600;}

.album-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
@media(min-width:560px){.album-grid{grid-template-columns:repeat(4,1fr);}}
@media(min-width:820px){.album-grid{grid-template-columns:repeat(6,1fr);}}
.album-cell{
  position:relative;aspect-ratio:1;border-radius:13px;overflow:hidden;
  background:#F3E8D4;box-shadow:var(--shadow);
}
.album-cell img,.album-cell video{width:100%;height:100%;object-fit:cover;display:block;}
.album-cell .vt{
  position:absolute;right:5px;top:5px;background:rgba(0,0,0,.5);color:#fff;
  border-radius:7px;padding:1px 6px;font-size:10px;
}
.album-cell .cap{
  position:absolute;left:0;right:0;bottom:0;padding:14px 7px 6px;
  background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;
  font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.album-cell .del{
  position:absolute;left:5px;top:5px;width:24px;height:24px;border-radius:8px;
  background:rgba(0,0,0,.45);color:#fff;font-size:12px;display:flex;
  align-items:center;justify-content:center;
}

.upload-panel{
  position:fixed;left:50%;bottom:24px;
  transform:translateX(-50%);z-index:400;width:min(88vw,380px);
  background:#FFFCF5;border-radius:18px;padding:16px;
  box-shadow:0 10px 40px rgba(120,90,50,.28);border:1px solid var(--border);
  bottom: calc(24px + constant(safe-area-inset-bottom));
  bottom: calc(24px + env(safe-area-inset-bottom));
}
.up-title{font-size:13.5px;font-weight:700;color:#6B543C;margin-bottom:8px;}
.up-file{font-size:11.5px;color:var(--text-l);margin-bottom:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.up-bar{height:7px;border-radius:4px;background:#F0E4CE;overflow:hidden;}
.up-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#E9C79B,#C89B6A);transition:width .2s;width:0;}

.chart-wrap{background:var(--card);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);margin-bottom:12px;}
.chart-wrap canvas{width:100%;height:260px;display:block;}
.legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:10px;font-size:11.5px;color:var(--text-l);}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle;}
.disclaimer{
  font-size:11.5px;color:#A89179;line-height:1.6;background:#FFF7E8;
  border-radius:12px;padding:10px 12px;margin-top:10px;border:1px dashed #E8D9BC;
}

.tag{display:inline-block;padding:2px 9px;border-radius:9px;font-size:11px;font-weight:700;}
.tag.done{background:#E6F0E0;color:#5B7A4E;}
.tag.pending{background:#FDEEE0;color:#C08A4A;}
.tag.skipped{background:#F2ECE4;color:#95826B;}
.tag.low{background:#FBEAE4;color:#C0654F;}
.tag.ok{background:#E9F2E4;color:#5B7A4E;}

.seg{display:flex;background:#F5EADA;border-radius:12px;padding:3px;gap:3px;}
.seg button{
  flex:1;padding:8px;border-radius:10px;font-size:13.5px;font-weight:600;
  color:#8B7A66;
}
.seg button.sel{background:#fff;color:var(--primary-d);box-shadow:0 2px 6px rgba(180,140,90,.15);}

.stat-row{display:flex;justify-content:space-between;font-size:13.5px;padding:8px 0;border-bottom:1px dashed #F0E4CE;}
.stat-row:last-child{border-bottom:none;}
.stat-row span:last-child{font-weight:700;color:#6B543C;}

.hint{font-size:12px;color:#A89179;margin-top:6px;line-height:1.6;}

#toast{
  position:fixed;left:50%;top:20px;
  transform:translate(-50%,-24px);z-index:500;opacity:0;pointer-events:none;
  background:rgba(90,74,58,.94);color:#fff;padding:11px 20px;border-radius:14px;

<script>
/* =====================================================================
   成长记录档案  —— 多设备同步版
   数据同步方案：GitHub Issues 作为云端数据库
   ===================================================================== */

if(!String.prototype.padStart){
  String.prototype.padStart = function(len, ch){
    var s = String(this); ch = String(ch || ' ');
    if(s.length >= len) return s;
    var pad = '';
    while(pad.length < len - s.length) pad += ch;
    return pad.slice(0, len - s.length) + s;
  };
}

function $(s){ return document.querySelector(s); }
function $$(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
function esc(s){
  return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function pad2(n){ n = String(n); return n.length < 2 ? '0' + n : n; }
function todayStr(){
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function tsToDate(ts){
  var d = new Date(ts);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function tsToTime(ts){
  var d = new Date(ts);
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function tsToLocalInput(ts){
  var d = new Date(ts);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate())
    + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function fmtDate(s){
  if(!s) return '—';
  var p = String(s).split('-');
  if(p.length < 3) return s;
  return p[0] + '年' + parseInt(p[1], 10) + '月' + parseInt(p[2], 10) + '日';
}
function fmtDateShort(s){
  if(!s) return '';
  var p = String(s).split('-');
  if(p.length < 3) return s;
  var d = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
  var wk = ['日','一','二','三','四','五','六'];
  return parseInt(p[1], 10) + '月' + parseInt(p[2], 10) + '日 周' + wk[d.getDay()];
}
function fmtSize(b){
  if(b === null || b === undefined) return '';
  if(b < 1024) return b + ' B';
  if(b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  if(b < 1073741824) return (b / 1048576).toFixed(1) + ' MB';
  return (b / 1073741824).toFixed(2) + ' GB';
}
function daysBetween(a, b){ return Math.floor((new Date(b) - new Date(a)) / 86400000); }
function ageMonths(birth, date){
  var b = new Date(birth), d = new Date(date);
  var m = (d.getFullYear() - b.getFullYear()) * 12 + (d.getMonth() - b.getMonth());
  if(d.getDate() < b.getDate()) m--;
  return Math.max(0, m);
}
function toast(msg, ms){
  ms = ms || 2200;
  var t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.classList.remove('show'); }, ms);
}

var THEME_KEY = 'bb_theme';
function loadTheme(){
  try{
    var t = localStorage.getItem(THEME_KEY);
    if(t === 'night'){ document.body.classList.add('night'); return 'night'; }
  }catch(e){}
  return 'day';
}
function toggleTheme(){
  var isNight = document.body.classList.toggle('night');
  try{ localStorage.setItem(THEME_KEY, isNight ? 'night' : 'day'); }catch(e){}
  var btn = $('#themeToggle');
  if(btn) btn.textContent = isNight ? '☀️' : '🌙';
  toast(isNight ? '已切换到夜间模式 🌙' : '已切换到白天模式 ☀️');
  if(state.route === 'growth') requestAnimationFrame(function(){ drawGrowthChart(); });
  if(state.route === 'feeding') requestAnimationFrame(function(){ drawFeedChart(); });
}

/* =====================================================================
   存储层：内存 + localStorage 镜像 + IndexedDB
   ===================================================================== */
var DB_NAME = 'bb_workbench';
var DB_VER = 1;
var STORES = ['babies','feeding','growth','album','albumFiles','vaccine','medical','inventory','montessori','motor','diary'];
var MIRROR_STORES = STORES.filter(function(s){ return s !== 'albumFiles'; });
var MIRROR_PREFIX = 'bb_mirror_v1_';
var BACKUP_KEY = 'bb_last_backup_at';

var _db = null;
var _idbState = 'pending';
var _idbPromise = null;
var _backend = 'unknown';
var _memBlobs = {};

var MEM = {};
var MEM_READY = {};
var MEM_LOADING = {};
var WRITE_CHAIN = {};

function readMirror(store){
  try{
    var raw = localStorage.getItem(MIRROR_PREFIX + store);
    if(!raw) return [];
    var obj = JSON.parse(raw);
    if(Array.isArray(obj)) return obj;
    if(obj && Array.isArray(obj.rows)) return obj.rows;
    return [];
  }catch(e){ return []; }
}
function writeMirror(store, rows){
  if(store === 'albumFiles') return;
  var payload = { t: Date.now(), v: 1, rows: rows };
  try{
    localStorage.setItem(MIRROR_PREFIX + store, JSON.stringify(payload));
    return;
  }catch(e){}
  var n = rows.length;
  while(n > 20){
    n = Math.floor(n * 0.7);
    payload.rows = rows.slice(rows.length - n);
    payload.trimmed = true;
    try{
      localStorage.setItem(MIRROR_PREFIX + store, JSON.stringify(payload));
      return;
    }catch(e2){}
  }
  try{ localStorage.removeItem(MIRROR_PREFIX + store); }catch(e3){}
}
function flushMirrors(){
  MIRROR_STORES.forEach(function(store){
    if(MEM_READY[store]) writeMirror(store, MEM[store] || []);
  });
}
function mirrorSize(){
  var total = 0;
  MIRROR_STORES.forEach(function(store){
    try{
      var raw = localStorage.getItem(MIRROR_PREFIX + store);
      if(raw) total += raw.length;
    }catch(e){}
  });
  return total;
}
function getLastBackup(){
  try{ return parseInt(localStorage.getItem(BACKUP_KEY), 10) || 0; }catch(e){ return 0; }
}
function setLastBackup(){
  try{ localStorage.setItem(BACKUP_KEY, String(Date.now())); }catch(e){}
}

function openDB(){
  if(_idbPromise) return _idbPromise;
  _idbPromise = new Promise(function(resolve){
    var settled = false;
    function finish(db, stateStr){
      if(settled) return;
      settled = true;
      _db = db;
      _idbState = stateStr;
      if(db) _backend = 'idb';
      resolve(db);
    }
    if(!window.indexedDB){
      _idbState = 'failed'; _backend = 'ls';
      return finish(null, 'failed');
    }
    var timer = setTimeout(function(){
      if(!settled){ _backend = 'ls'; finish(null, 'timeout'); }
    }, 4000);
    try{
      var req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = function(e){
        var db = e.target.result;
        STORES.forEach(function(name){
          if(!db.objectStoreNames.contains(name)){
            var st = db.createObjectStore(name, { keyPath: 'id' });
            if(name !== 'babies' && name !== 'albumFiles') st.createIndex('babyId', 'babyId');
          }
        });
      };
      req.onsuccess = function(e){
        clearTimeout(timer);
        var db = e.target.result;
        _db = db; _backend = 'idb'; _idbState = 'ok';
        if(settled){
          flushAllToIdb();
          render();
        }else{
          finish(db, 'ok');
        }
      };
      req.onerror = function(){
        clearTimeout(timer);
        _idbState = 'failed';
        if(!_backend || _backend === 'unknown') _backend = 'ls';
        finish(null, 'failed');
      };
    }catch(err){
      clearTimeout(timer);
      _idbState = 'failed'; _backend = 'ls';
      finish(null, 'failed');
    }
  });
  return _idbPromise;
}
function flushAllToIdb(){
  if(!_db) return;
  MIRROR_STORES.forEach(function(store){
    if(!MEM_READY[store]) return;
    var rows = MEM[store] || [];
    if(!rows.length) return;
    try{
      var tx = _db.transaction(store, 'readwrite');
      var os = tx.objectStore(store);
      rows.forEach(function(r){ try{ os.put(r); }catch(e){} });
    }catch(e){}
  });
}

function idbAllRaw(store){
  return openDB().then(function(db){
    if(!db) return [];
    return new Promise(function(res){
      try{
        var tx = db.transaction(store, 'readonly');
        var rq = tx.objectStore(store).getAll();
        rq.onsuccess = function(){ res(rq.result || []); };
        rq.onerror = function(){ res([]); };
      }catch(e){ res([]); }
    });
  });
}
function idbGetRaw(store, id){
  return openDB().then(function(db){
    if(!db) return null;
    return new Promise(function(res){
      try{
        var tx = db.transaction(store, 'readonly');
        var rq = tx.objectStore(store).get(id);
        rq.onsuccess = function(){ res(rq.result || null); };
        rq.onerror = function(){ res(null); };
      }catch(e){ res(null); }
    });
  });
}
function idbPutRaw(store, obj){
  return openDB().then(function(db){
    if(!db) return;
    return new Promise(function(res, rej){
      try{
        var tx = db.transaction(store, 'readwrite');
        tx.objectStore(store).put(obj);
        tx.oncomplete = function(){ res(); };
        tx.onerror = function(){ rej(tx.error); };
        tx.onabort = function(){ rej(tx.error || new Error('事务中止')); };
      }catch(e){ rej(e); }
    });
  });
}
function idbDelRaw(store, id){
  return openDB().then(function(db){
    if(!db) return;
    return new Promise(function(res, rej){
      try{
        var tx = db.transaction(store, 'readwrite');
        tx.objectStore(store).delete(id);
        tx.oncomplete = function(){ res(); };
        tx.onerror = function(){ rej(tx.error); };
      }catch(e){ rej(e); }
    });
  });
}
function idbClearRaw(store){
  return openDB().then(function(db){
    if(!db) return;
    return new Promise(function(res, rej){
      try{
        var tx = db.transaction(store, 'readwrite');
        tx.objectStore(store).clear();
        tx.oncomplete = function(){ res(); };
        tx.onerror = function(){ rej(tx.error); };
      }catch(e){ rej(e); }
    });
  });
}
function queueIdbPut(store, obj){
  WRITE_CHAIN[store] = (WRITE_CHAIN[store] || Promise.resolve())
    .then(function(){ return idbPutRaw(store, obj); })
    .catch(function(){});
  return WRITE_CHAIN[store];
}
function queueIdbDel(store, id){
  WRITE_CHAIN[store] = (WRITE_CHAIN[store] || Promise.resolve())
    .then(function(){ return idbDelRaw(store, id); })
    .catch(function(){});
  return WRITE_CHAIN[store];
}

function rowTime(r){
  if(!r) return 0;
  return r._updatedAt || r.updatedAt || r.createdAt || 0;
}
function mergeRows(dbRows, mirrorRows){
  var map = {}, order = [];
  (dbRows || []).forEach(function(r){
    if(!r || !r.id) return;
    if(!map[r.id]) order.push(r.id);
    map[r.id] = r;
  });
  (mirrorRows || []).forEach(function(r){
    if(!r || !r.id) return;
    if(!map[r.id]){
      map[r.id] = r;
      order.push(r.id);
    }else if(rowTime(r) > rowTime(map[r.id])){
      map[r.id] = r;
    }
  });
  return order.map(function(id){ return map[id]; });
}

function memLoad(store){
  if(MEM_READY[store]) return Promise.resolve(MEM[store]);
  if(MEM_LOADING[store]) return MEM_LOADING[store];

  MEM_LOADING[store] = (function(){
    if(store === 'albumFiles'){
      return idbAllRaw('albumFiles').then(function(rows){
        rows = rows || [];
        if(!rows.length){
          var mem = [];
          for(var k in _memBlobs){ if(_memBlobs.hasOwnProperty(k)) mem.push(_memBlobs[k]); }
          rows = mem;
        }
        MEM['albumFiles'] = rows;
        MEM_READY['albumFiles'] = true;
        return rows;
      });
    }
    return openDB().then(function(){
      return idbAllRaw(store);
    }).then(function(dbRows){
      dbRows = dbRows || [];
      var mirrorRows = readMirror(store);
      var merged = mergeRows(dbRows, mirrorRows);
      MEM[store] = merged;
      MEM_READY[store] = true;
      if(merged.length > dbRows.length){
        merged.forEach(function(r){
          var found = false;
          for(var i = 0; i < dbRows.length; i++){
            if(dbRows[i].id === r.id){ found = true; break; }
          }
          if(!found) queueIdbPut(store, r);
        });
      }
      writeMirror(store, merged);
      return merged;
    });
  })();
  return MEM_LOADING[store];
}

function dbAll(store, includeDeleted){
  if(store === 'albumFiles'){
    return idbAllRaw(store).then(function(rows){
      if(rows && rows.length) return rows;
      var out = [];
      for(var k in _memBlobs){ if(_memBlobs.hasOwnProperty(k)) out.push(_memBlobs[k]); }
      return out;
    });
  }
  return memLoad(store).then(function(rows){
    if(includeDeleted) return rows.slice();
    return rows.filter(function(r){ return !r._deleted; });
  });
}
function dbGet(store, id){
  if(store === 'albumFiles'){
    return idbGetRaw(store, id).then(function(r){ return r || _memBlobs[id] || null; });
  }
  return memLoad(store).then(function(rows){
    for(var i = 0; i < rows.length; i++){
      if(rows[i].id === id) return rows[i];
    }
    return null;
  });
}
function dbPut(store, obj){
  if(store === 'albumFiles'){
    _memBlobs[obj.id] = obj;
    return idbPutRaw(store, obj).then(function(){ return obj; }).catch(function(){ return obj; });
  }
  obj._updatedAt = Date.now();
  return memLoad(store).then(function(rows){
    var idx = -1;
    for(var i = 0; i < rows.length; i++){
      if(rows[i].id === obj.id){ idx = i; break; }
    }
    if(idx >= 0) rows[idx] = obj; else rows.push(obj);
    writeMirror(store, rows);
    return queueIdbPut(store, obj).then(function(){ return obj; });
  });
}
function dbDel(store, id){
  if(store === 'albumFiles'){
    delete _memBlobs[id];
    return idbDelRaw(store, id).catch(function(){});
  }
  return memLoad(store).then(function(rows){
    for(var i = 0; i < rows.length; i++){
      if(rows[i].id === id){
        if(syncState.enabled){
          rows[i]._deleted = true;
          rows[i]._updatedAt = Date.now();
          writeMirror(store, rows);
          return queueIdbPut(store, rows[i]);
        }
        break;
      }
    }
    var out = rows.filter(function(x){ return x.id !== id; });
    MEM[store] = out;
    writeMirror(store, out);
    return queueIdbDel(store, id);
  });
}
function dbClear(store){
  if(store === 'albumFiles'){
    _memBlobs = {};
    return idbClearRaw(store).catch(function(){});
  }
  MEM[store] = [];
  MEM_READY[store] = true;
  try{ localStorage.removeItem(MIRROR_PREFIX + store); }catch(e){}
  return idbClearRaw(store).catch(function(){});
}
function dbByBaby(store, babyId, includeDeleted){
  return dbAll(store, includeDeleted).then(function(all){
    return all.filter(function(x){ return x.babyId === babyId; });
  });
}

function requestPersistentStorage(){
  try{
    if(!navigator.storage || !navigator.storage.persist){ state.persistSupported = false; return; }
    state.persistSupported = true;
    navigator.storage.persisted().then(function(already){
      if(already){ state.persisted = true; return true; }
      return navigator.storage.persist().then(function(granted){
        state.persisted = !!granted;
        return granted;
      });
    }).catch(function(){ state.persisted = false; })
    .then(function(){ if(state.route === 'home' || state.route === 'profile') render(); });
  }catch(e){ state.persistSupported = false; }
}

/* =====================================================================
   GitHub 同步模块
   ===================================================================== */
var SYNC_KEY = 'bb_github_sync_v1';
var GH_LABEL = 'growth-board-record';
var syncState = {
  enabled: false, owner: '', repo: '', token: '',
  lastSyncAt: 0, syncing: false, autoSync: true
};

function loadSyncConfig(){
  try{
    var raw = localStorage.getItem(SYNC_KEY);
    if(!raw) return;
    var obj = JSON.parse(raw);
    syncState.owner = obj.owner || '';
    syncState.repo = obj.repo || '';
    syncState.token = obj.token || '';
    syncState.lastSyncAt = obj.lastSyncAt || 0;
    syncState.autoSync = obj.autoSync !== false;
    syncState.enabled = !!(syncState.owner && syncState.repo && syncState.token);
  }catch(e){}
}
function saveSyncConfig(){
  try{
    localStorage.setItem(SYNC_KEY, JSON.stringify({
      owner: syncState.owner, repo: syncState.repo, token: syncState.token,
      lastSyncAt: syncState.lastSyncAt, autoSync: syncState.autoSync
    }));
  }catch(e){}
}
function ghHeaders(){
  return {
    'Authorization': 'Bearer ' + syncState.token,
    'Accept': 'application/vnd.github+json',
    'Content-Type': 'application/json'
  };
}
function ghFetch(path, opts){
  opts = opts || {};
  opts.headers = Object.assign(ghHeaders(), opts.headers || {});
  return fetch('https://api.github.com' + path, opts).then(function(r){
    if(r.status === 204) return null;
    return r.json().catch(function(){ return {}; }).then(function(data){
      if(!r.ok){
        var msg = data.message || r.statusText;
        if(r.status === 401) msg = '令牌无效或已过期';
        if(r.status === 404) msg = '仓库不存在或令牌无权限';
        if(r.status === 403) msg = '权限不足或API额度用尽';
        throw new Error(msg);
      }
      return data;
    });
  });
}
function ghTest(){
  if(!syncState.owner || !syncState.repo || !syncState.token){
    return Promise.reject(new Error('请先填写完整信息'));
  }
  return ghFetch('/repos/' + syncState.owner + '/' + syncState.repo).then(function(repo){
    return repo.full_name;
  });
}
function ghPullAll(){
  var all = [];
  var page = 1;
  function next(){
    return ghFetch('/repos/' + syncState.owner + '/' + syncState.repo
      + '/issues?state=all&labels=' + GH_LABEL + '&per_page=100&page=' + page)
      .then(function(list){
        if(!list || !list.length) return all;
        all = all.concat(list);
        if(list.length < 100) return all;
        page++;
        if(page > 30) return all;
        return next();
      });
  }
  return next();
}
function ghIssueTitle(store, rec){
  var t = '[' + store + '] ' + (rec.name || rec.title || rec.id || 'record');
  if(t.length > 200) t = t.slice(0, 200);
  return t;
}
function ghCreateIssue(store, rec){
  return ghFetch('/repos/' + syncState.owner + '/' + syncState.repo + '/issues', {
    method: 'POST',
    body: JSON.stringify({
      title: ghIssueTitle(store, rec),
      body: JSON.stringify({ store: store, record: rec }),
      labels: [GH_LABEL, 'store:' + store]
    })
  });
}
function ghUpdateIssue(number, store, rec){
  return ghFetch('/repos/' + syncState.owner + '/' + syncState.repo + '/issues/' + number, {
    method: 'PATCH',
    body: JSON.stringify({
      title: ghIssueTitle(store, rec),
      body: JSON.stringify({ store: store, record: rec })
    })
  });
}
function ghCloseIssue(number){
  return ghFetch('/repos/' + syncState.owner + '/' + syncState.repo + '/issues/' + number, {
    method: 'PATCH',
    body: JSON.stringify({ state: 'closed' })
  });
}

function syncNow(silent){
  if(syncState.syncing) return Promise.resolve();
  if(!syncState.enabled){
    if(!silent) toast('请先在「宝宝档案 → 多设备同步」中配置');
    return Promise.resolve();
  }
  syncState.syncing = true;
  if(!silent) toast('正在同步…');
  if(state.route === 'profile') render();

  var loadChain = Promise.resolve();
  MIRROR_STORES.forEach(function(s){
    loadChain = loadChain.then(function(){ return memLoad(s); });
  });

  return loadChain.then(function(){
    return ghPullAll();
  }).then(function(issues){
    var remoteByStore = {};
    (issues || []).forEach(function(iss){
      var parsed;
      try{ parsed = JSON.parse(iss.body || '{}'); }catch(e){ return; }
      if(!parsed.store || !parsed.record || !parsed.record.id) return;
      if(!remoteByStore[parsed.store]) remoteByStore[parsed.store] = {};
      remoteByStore[parsed.store][parsed.record.id] = {
        record: parsed.record,
        number: iss.number,
        state: iss.state
      };
    });

    var pushList = [];

    MIRROR_STORES.forEach(function(store){
      var localRows = MEM[store] || [];
      var localMap = {};
      localRows.forEach(function(r){ localMap[r.id] = r; });

      var remote = remoteByStore[store] || {};

      /* 拉取：远端 → 本地 */
      Object.keys(remote).forEach(function(id){
        var info = remote[id];
        var rrec = JSON.parse(JSON.stringify(info.record));
        var lrec = localMap[id];
        var rIsClosed = info.state === 'closed';
        if(rIsClosed) rrec._deleted = true;

        if(!lrec){
          if(rIsClosed) return; /* 远端已删除且本地没有，忽略 */
          localRows.push(rrec);
          queueIdbPut(store, rrec);
        }else{
          if(rowTime(rrec) > rowTime(lrec)){
            for(var i = 0; i < localRows.length; i++){
              if(localRows[i].id === id){ localRows[i] = rrec; break; }
            }
            queueIdbPut(store, rrec);
          }
        }
      });

      MEM[store] = localRows;
      writeMirror(store, localRows);

      /* 推送：本地 → 远端 */
      localRows.forEach(function(r){
        var info = remote[r.id];
        if(!info){
          if(!r._deleted) pushList.push({ store: store, record: r, number: null });
        }else{
          if(r._deleted && info.state !== 'closed'){
            pushList.push({ store: store, record: r, number: info.number, close: true });
          }else if(!r._deleted && rowTime(r) > rowTime(info.record)){
            pushList.push({ store: store, record: r, number: info.number });
          }
        }
      });
    });

    var pushed = 0;
    var chain = Promise.resolve();
    pushList.forEach(function(item){
      chain = chain.then(function(){
        if(item.close){
          return ghCloseIssue(item.number).then(function(){ pushed++; });
        }else if(item.number){
          return ghUpdateIssue(item.number, item.store, item.record).then(function(){ pushed++; });
        }else{
          return ghCreateIssue(item.store, item.record).then(function(){ pushed++; });
        }
      }).catch(function(e){
        console.warn('单条推送失败：', e);
      });
    });
    return chain.then(function(){ return pushed; });
  }).then(function(pushed){
    syncState.syncing = false;
    syncState.lastSyncAt = Date.now();
    saveSyncConfig();
    if(!silent) toast('同步完成 ✅ 已处理 ' + pushed + ' 条');
    if(state.route === 'profile' || state.route === 'home') render();
  }).catch(function(e){
    syncState.syncing = false;
    console.error('同步失败：', e);
    if(!silent) toast('同步失败：' + e.message);
    if(state.route === 'profile') render();
  });
}

}

function buildNav(){
  var nav = $('#nav');
  if(!nav) return;
  var html = '';
  ROUTES.forEach(function(r){
    html += '<a class="nav-item' + (state.route === r.id ? ' active' : '') + '" href="#' + r.id + '" data-route="' + r.id + '">'
      + '<span class="nav-icon">' + r.icon + '</span>'
      + '<span>' + r.name + '</span>'
      + '</a>';
  });
  nav.innerHTML = html;
}
function closeSidebar(){
  var sb = $('#sidebar'); var mk = $('#mask');
  if(sb) sb.classList.remove('open');
  if(mk) mk.classList.remove('show');
}
function bindGlobalEvents(){
  var hb = $('#hamburger');
  if(hb) hb.addEventListener('click', function(){
    var sb = $('#sidebar'); var mk = $('#mask');
    if(sb) sb.classList.toggle('open');
    if(mk) mk.classList.toggle('show');
  });
  var mk = $('#mask');
  if(mk) mk.addEventListener('click', closeSidebar);
  var nav = $('#nav');
  if(nav) nav.addEventListener('click', function(e){
    var item = e.target.closest ? e.target.closest('.nav-item') : null;
    if(!item) return;
    e.preventDefault();
    var route = item.getAttribute('data-route');
    if(route){ navigateTo(route); closeSidebar(); }
  });
}
function navigateTo(route){
  var exists = false;
  for(var i = 0; i < ROUTES.length; i++){
    if(ROUTES[i].id === route){ exists = true; break; }
  }
  if(!exists) route = 'home';
  if(!state.baby && route !== 'profile') route = 'profile';
  state.route = route;
  try{
    if(('#' + route) !== location.hash){
      if(history && history.replaceState) history.replaceState(null, '', '#' + route);
      else location.hash = '#' + route;
    }
  }catch(e){}
  render();
}
function renderErrorHtml(err){
  return '<div style="padding:24px;color:#C0654F;font-size:14px;line-height:1.9">'
    + '<b style="font-size:16px">⚠️ 页面加载出错</b><br><br>'
    + '原因：' + esc(err && err.message ? err.message : String(err)) + '<br><br>'
    + '<b>建议：</b><br>1. 使用 Safari 浏览器打开<br>2. 清除浏览器缓存后重试'
    + '</div>';
}
function render(){
  state.objectURLs.forEach(function(u){ try{ URL.revokeObjectURL(u); }catch(e){} });
  state.objectURLs = [];

  buildNav();
  var titleEl = $('#topTitle');
  if(titleEl) titleEl.textContent = MODULE_TITLES[state.route] || '首页';

  if(!state.baby && state.route !== 'profile'){
    state.route = 'profile';
    if(titleEl) titleEl.textContent = '宝宝档案';
    buildNav();
    try{ if(history && history.replaceState) history.replaceState(null, '', '#profile'); }catch(e){}
  }

  var el = $('#content');
  if(!el) return;
  el.scrollTop = 0;

  var p;
  try{
    switch(state.route){
      case 'home':       p = viewHome(); break;
      case 'profile':    p = viewProfile(); break;
      case 'album':      p = viewAlbum(); break;
      case 'feeding':    p = viewFeeding(); break;
      case 'foodlib':    p = viewFoodLib(); break;
      case 'growth':     p = viewGrowth(); break;
      case 'montessori': p = viewMontessori(); break;
      case 'motor':      p = viewMotor(); break;
      case 'vaccine':    p = viewVaccine(); break;
      case 'medical':    p = viewMedical(); break;
      case 'inventory':  p = viewInventory(); break;
      case 'diary':      p = viewDiary(); break;
      default:
        p = Promise.resolve('<div class="empty"><span class="ico">🌿</span><p>页面不存在</p></div>');
    }
  }catch(e){
    console.error('view 函数异常:', e);
    el.innerHTML = renderErrorHtml(e);
    return;
  }

  Promise.resolve(p).then(function(html){
    el.innerHTML = html;
    if(state.route === 'growth') requestAnimationFrame(function(){ drawGrowthChart(); });
    if(state.route === 'album') fillAlbumThumbs();
    if(state.route === 'feeding') requestAnimationFrame(function(){ drawFeedChart(); });
  }).catch(function(err){
    console.error('渲染失败:', err);
    el.innerHTML = renderErrorHtml(err);
  });
}

function showModal(opts){
  var mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML = ''
    + '<div class="modal">'
    +   '<div class="modal-head">'
    +     '<h3>' + esc(opts.title) + '</h3>'
    +     '<button type="button" class="modal-close">✕</button>'
    +   '</div>'
    +   '<form class="modal-body" autocomplete="off">' + opts.body + '</form>'
    +   '<div class="modal-foot">'
    +     '<button type="button" class="btn-ghost modal-cancel">取消</button>'
    +     '<button type="button" class="btn-primary modal-ok">' + esc(opts.submitText || '保存') + '</button>'
    +   '</div>'
    + '</div>';
  document.body.appendChild(mask);
  requestAnimationFrame(function(){ mask.classList.add('show'); });
  function close(){
    mask.classList.remove('show');
    setTimeout(function(){ if(mask.parentNode) mask.parentNode.removeChild(mask); }, 220);
  }
  mask.querySelector('.modal-close').onclick = close;
  mask.querySelector('.modal-cancel').onclick = close;
  mask.querySelector('.modal-ok').onclick = function(){
    var form = mask.querySelector('form');
    var fd = new FormData(form);
    var data = {};
    fd.forEach(function(v, k){ data[k] = v; });
    Promise.resolve()
      .then(function(){ return opts.onSubmit(data, mask); })
      .then(function(ok){ if(ok !== false) close(); })
      .catch(function(err){ toast('保存失败：' + (err && err.message ? err.message : err)); });
  };
  return { el: mask, close: close };
}
function confirmDialog(msg, onOk){
  var mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML = ''
    + '<div class="modal" style="max-width:360px">'
    +   '<div class="modal-head"><h3>确认操作</h3></div>'
    +   '<div class="modal-body" style="font-size:14.5px;color:#6B543C;line-height:1.7">' + esc(msg) + '</div>'
    +   '<div class="modal-foot">'
    +     '<button type="button" class="btn-ghost c-no">取消</button>'
    +     '<button type="button" class="btn-danger c-yes" style="flex:1;padding:13px;border-radius:14px;font-size:15px">确定删除</button>'
    +   '</div>'
    + '</div>';
  document.body.appendChild(mask);
  requestAnimationFrame(function(){ mask.classList.add('show'); });
  function close(){
    mask.classList.remove('show');
    setTimeout(function(){ if(mask.parentNode) mask.parentNode.removeChild(mask); }, 220);
  }
  mask.querySelector('.c-no').onclick = close;
  mask.querySelector('.c-yes').onclick = function(){
    close();
    Promise.resolve().then(onOk).catch(function(e){ toast('操作失败：' + e.message); });
  };
}

function viewHome(){

      .reduce(function(s, f){ return s + (+f.amountMl || 0); }, 0);
    var diaperCount = dayFeed.filter(function(f){ return f.type === 'diaper'; })
      .reduce(function(s, f){ return s + (+f.count || 1); }, 0);
    var solids = dayFeed.filter(function(f){ return f.type === 'solid'; })
      .map(function(f){ return f.foodName; }).filter(Boolean);
    var supplementDone = dayFeed.some(function(f){ return f.type === 'supplement'; });
    var sleepMin = dayFeed.filter(function(f){ return f.type === 'sleep'; })
      .reduce(function(s, f){ return s + (+f.minutes || 0); }, 0);

      html += '<div class="reminder safe" style="cursor:pointer" onclick="syncNow()">'

        + '<span class="r-ico">⚠️</span><span>'

      +     (isToday ? '📅 今天 · ' + fmtDateShort(viewDate) : '📅 ' + fmtDateShort(viewDate))

      + '</div>'

      + '<div class="stat"><div class="stat-top"><span>💊</span><span>补充剂打卡</span></div><div class="stat-val" style="font-size:16px">' + (supplementDone ? '✅ 已完成' : '⏳ 待打卡') + '</div></div>'

function changeHomeDate(delta){
  var d = new Date(state.homeDate || todayStr());
  d.setDate(d.getDate() + delta);
  var newDate = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  if(newDate > todayStr()) return;
  state.homeDate = newDate;
  render();
}
function changeHomeDateTo(dateStr){
  if(!dateStr) return;
  if(dateStr > todayStr()){ toast('不能选择未来日期'); return; }
  state.homeDate = dateStr;
  render();
}

}

   云相册（本地，不参与同步）

var MAX_FILES = 12;
var MAX_IMAGE_SIZE = 80 * 1024 * 1024;
var MAX_VIDEO_SIZE = 1024 * 1024 * 1024;
var _albumCache = [];

function viewAlbum(){
  return dbByBaby('album', state.babyId).then(function(items){
    items.sort(function(a, b){
      return (b.takenAt || '').localeCompare(a.takenAt || '') || b.createdAt - a.createdAt;
    });
    _albumCache = items;

    var html = ''
      + '<div class="page-head">'
      +   '<h1>云相册<span class="sub">共 ' + items.length + ' 张照片 / 视频</span></h1>'
      + '</div>'
      + '<div class="card" style="display:flex;gap:10px;align-items:center">'
      +   '<div style="flex:1">'
      +     '<div style="font-size:13.5px;font-weight:600;color:#6B543C">上传照片和视频</div>'
      +     '<div class="hint" style="margin-top:2px">单次最多 12 个 · 图片 ≤80MB · 视频 ≤1GB</div>'
      +   '</div>'
      +   '<button class="btn-primary" id="albumPickBtn">＋ 选择</button>'
      +   '<input type="file" id="albumPicker" accept="image/*,video/*" multiple hidden>'
      + '</div>'
      + '<div class="disclaimer" style="margin-bottom:12px">'
      +   '📌 照片和视频保存在本机浏览器数据库中，<b>不参与云端同步</b>（体积太大）。重要照片请同时在系统相册保留一份。'
      + '</div>'
      + (items.length === 0
          ? '<div class="empty"><span class="ico">📸</span><p>还没有照片，点击上方「＋ 选择」<br>从手机相册上传宝宝的成长瞬间</p></div>'
          : '<div class="album-grid" id="albumGrid"></div>');

    setTimeout(function(){
      var picker = $('#albumPicker');
      var btn = $('#albumPickBtn');
      if(btn && picker) btn.onclick = function(){ picker.click(); };
      if(picker){
        picker.onchange = function(){
          var files = Array.prototype.slice.call(picker.files || []);
          picker.value = '';
          if(!files.length) return;
          handleUpload(files);
        };
      }
    }, 0);
    return html;
  });
}
function fillAlbumThumbs(){
  var grid = $('#albumGrid');
  if(!grid) return;
  grid.innerHTML = '';
  var i = 0;
  function next(){
    if(i >= _albumCache.length) return;
    var it = _albumCache[i++];
    var cell = document.createElement('div');
    cell.className = 'album-cell';
    cell.setAttribute('data-id', it.id);
    grid.appendChild(cell);
    dbGet('albumFiles', it.id).then(function(fileRec){
      if(!fileRec || !fileRec.blob){
        cell.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:22px;color:#C4B49B">⚠️</div>';
        return;
      }
      var url = URL.createObjectURL(fileRec.blob);
      state.objectURLs.push(url);
      if(it.mediaType === 'video'){
        cell.innerHTML = '<video src="' + url + '" muted playsinline preload="metadata"></video>'
          + '<span class="vt">▶ 视频</span>'
          + '<span class="del" data-del="' + it.id + '">🗑</span>'
          + (it.caption ? '<span class="cap">' + esc(it.caption) + '</span>' : '');
      }else{
        cell.innerHTML = '<img src="' + url + '" alt="" loading="lazy">'
          + '<span class="del" data-del="' + it.id + '">🗑</span>'
          + (it.caption ? '<span class="cap">' + esc(it.caption) + '</span>' : '');
      }
      cell.onclick = function(e){
        if(e.target && e.target.getAttribute && e.target.getAttribute('data-del')){
          var delId = e.target.getAttribute('data-del');
          e.stopPropagation();
          confirmDialog('确定删除这条相册记录吗？媒体文件也会一并清除，且无法恢复。', function(){
            return dbDel('album', delId)
              .then(function(){ return dbDel('albumFiles', delId); })
              .then(function(){ toast('已删除'); render(); });
          });
          return;
        }
        openMediaViewer(it.id);
      };
    }).catch(function(){
      cell.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:22px;color:#C4B49B">⚠️</div>';
    }).then(function(){ next(); });
  }
  next();
}
function handleUpload(files){
  if(files.length > MAX_FILES){
    alert('单次最多选择 ' + MAX_FILES + ' 个文件，当前选择了 ' + files.length + ' 个。请分批上传。');
    return;
  }
  for(var i = 0; i < files.length; i++){
    var f = files[i];
    var isVideo = f.type && f.type.indexOf('video/') === 0;
    var isImage = f.type && f.type.indexOf('image/') === 0;
    if(!isVideo && !isImage){ alert('不支持的文件类型：' + f.name); return; }
    if(isVideo && f.size > MAX_VIDEO_SIZE){ alert('「' + f.name + '」超过视频上限 1GB'); return; }
    if(isImage && f.size > MAX_IMAGE_SIZE){ alert('「' + f.name + '」超过图片上限 80MB'); return; }
  }
  var panel = document.createElement('div');
  panel.className = 'upload-panel';
  panel.innerHTML = ''
    + '<div class="up-title" id="upTitle">正在保存…</div>'
    + '<div class="up-file" id="upFile"></div>'
    + '<div class="up-bar"><div class="up-fill" id="upFill"></div></div>'
    + '<div class="hint" style="text-align:center">请勿关闭页面</div>';
  document.body.appendChild(panel);
  function setProgress(idx, total, name, pct){
    var t = panel.querySelector('#upTitle');
    var fEl = panel.querySelector('#upFile');
    var fill = panel.querySelector('#upFill');
    if(t) t.textContent = '正在保存 ' + idx + '/' + total;
    if(fEl) fEl.textContent = name;
    if(fill) fill.style.width = pct + '%';
  }
  function closePanel(){ if(panel.parentNode) panel.parentNode.removeChild(panel); }
  var savedIds = [];
  var chain = Promise.resolve();
  files.forEach(function(f, idx){
    chain = chain.then(function(){
      setProgress(idx + 1, files.length, f.name, 8);
      var id = uid();
      return dbPut('albumFiles', { id: id, blob: f }).then(function(){
        setProgress(idx + 1, files.length, f.name, 55);
        var meta = {
          id: id, babyId: state.babyId,
          mediaType: (f.type && f.type.indexOf('video/') === 0) ? 'video' : 'photo',
          fileName: f.name, fileSize: f.size, mimeType: f.type || '',
          caption: '', takenAt: f.lastModified ? tsToDate(f.lastModified) : todayStr(),
          createdAt: Date.now()
        };
        return dbPut('album', meta);
      }).then(function(){
        savedIds.push(id);
        setProgress(idx + 1, files.length, f.name, 100);
      });
    });
  });
  chain.then(function(){
    closePanel();
    toast('成功保存 ' + savedIds.length + ' 个文件 ✅');
    render();
  }).catch(function(err){
    closePanel();
    var rollback = Promise.resolve();
    savedIds.forEach(function(id){
      rollback = rollback
        .then(function(){ return dbDel('album', id).catch(function(){}); })
        .then(function(){ return dbDel('albumFiles', id).catch(function(){}); });
    });
    rollback.then(function(){
      alert('上传失败，已撤回 ' + savedIds.length + ' 个文件。\n原因：' + (err && err.message ? err.message : '存储空间不足'));
    });
  });
}
function openMediaViewer(id){
  Promise.all([dbGet('album', id), dbGet('albumFiles', id)]).then(function(res){
    var meta = res[0], fileRec = res[1];
    if(!meta || !fileRec){ toast('文件已丢失'); return; }
    var url = URL.createObjectURL(fileRec.blob);
    var mask = document.createElement('div');
    mask.className = 'modal-mask';
    mask.style.alignItems = 'center';
    mask.innerHTML = ''
      + '<div style="width:100%;max-width:560px;padding:0 12px">'
      +   '<div style="background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 12px 48px rgba(0,0,0,.3)">'
      +     '<div style="background:#1a1a1a;display:flex;align-items:center;justify-content:center;max-height:64vh;overflow:hidden">'
      +       (meta.mediaType === 'video'
                ? '<video src="' + url + '" controls playsinline style="width:100%;max-height:64vh;display:block"></video>'
                : '<img src="' + url + '" style="width:100%;max-height:64vh;object-fit:contain;display:block">')
      +     '</div>'
      +     '<div style="padding:14px 16px">'
      +       '<div style="font-size:12.5px;color:var(--text-l);margin-bottom:10px;word-break:break-all">'
      +         esc(meta.fileName || '') + ' · ' + fmtSize(meta.fileSize) + ' · ' + esc(meta.takenAt || '')
      +       '</div>'
      +       '<div class="field" style="margin-bottom:10px"><label>备注 / 说明</label>'
      +         '<input type="text" id="mvCaption" value="' + esc(meta.caption || '') + '" placeholder="记录这一刻…"></div>'
      +       '<div style="display:flex;gap:10px">'
      +         '<button class="btn-ghost" style="flex:1;padding:12px" id="mvClose">关闭</button>'
      +         '<button class="btn-primary" style="flex:1;padding:12px" id="mvSave">保存备注</button>'
      +       '</div>'
      +     '</div>'
      +   '</div>'
      + '</div>';
    document.body.appendChild(mask);
    requestAnimationFrame(function(){ mask.classList.add('show'); });
    function close(){
      mask.classList.remove('show');
      setTimeout(function(){
        if(mask.parentNode) mask.parentNode.removeChild(mask);
        try{ URL.revokeObjectURL(url); }catch(e){}
      }, 240);
    }
    mask.querySelector('#mvClose').onclick = close;
    mask.addEventListener('click', function(e){ if(e.target === mask) close(); });
    mask.querySelector('#mvSave').onclick = function(){
      meta.caption = mask.querySelector('#mvCaption').value.trim();
      dbPut('album', meta).then(function(){ toast('备注已保存'); close(); render(); });
    };
  });
}

var FEED_TYPES = [
  { v:'milk',       n:'奶量',     i:'🍼' },
  { v:'breast',     n:'母乳',     i:'🤱' },
  { v:'solid',      n:'辅食',     i:'🥣' },
  { v:'snack',      n:'点心水果', i:'🍎' },
  { v:'water',      n:'饮水',     i:'💧' },
  { v:'supplement', n:'营养补剂', i:'💊' },
  { v:'sleep',      n:'睡眠',     i:'😴' },
  { v:'diaper',     n:'尿不湿',   i:'🧷' },
  { v:'stool',      n:'大便形态', i:'💩' },
  { v:'bath',       n:'洗澡',     i:'🛁' }
];
var STOOL_SHAPES = [
  { v:'normal', n:'正常成形' },{ v:'soft', n:'偏软' },{ v:'loose', n:'稀糊' },
  { v:'watery', n:'水样' },{ v:'hard', n:'干硬' },{ v:'mucous', n:'黏液' },{ v:'color', n:'颜色异常' }
];
var FEED_TYPE_MAP = {};
FEED_TYPES.forEach(function(t){ FEED_TYPE_MAP[t.v] = t; });

var CHART_TYPES = [
  { v:'milk',   n:'🍼 奶量',   unit:'ml',   mode:'sum' },
  { v:'breast', n:'🤱 母乳',   unit:'分钟', mode:'sum' },
  { v:'sleep',  n:'😴 睡眠',   unit:'分钟', mode:'sum' },
  { v:'water',  n:'💧 饮水',   unit:'ml',   mode:'sum' },
  { v:'diaper', n:'🧷 尿不湿', unit:'次',   mode:'sum' },
  { v:'stool',  n:'💩 大便',   unit:'次',   mode:'count' },
  { v:'bath',   n:'🛁 洗澡',   unit:'次',   mode:'count' }
];

function feedSummary(f){
  switch(f.type){
    case 'milk':       return (f.amountMl || 0) + ' ml';
    case 'breast':     return (f.minutes || 0) + ' 分钟';
    case 'water':      return (f.amountMl || 0) + ' ml';
    case 'solid':      return f.foodName || '已记录';
    case 'snack':      return f.foodName || '已记录';
    case 'supplement': return f.supplementName || '已服用';
    case 'sleep':      return (f.minutes || 0) + ' 分钟';
    case 'diaper':     return (f.count || 1) + ' 次';
    case 'stool':
      var s = null;
      for(var i = 0; i < STOOL_SHAPES.length; i++){
        if(STOOL_SHAPES[i].v === f.stoolShape){ s = STOOL_SHAPES[i]; break; }
      }
      return s ? s.n : '已记录';
    case 'bath':       return '已洗澡';
    default:           return '已记录';
  }
}

function viewFeeding(){
  return dbByBaby('feeding', state.babyId).then(function(list){
    list.sort(function(a, b){ return b.recordedAt - a.recordedAt; });
    var groups = {}; var order = [];
    list.forEach(function(f){
      var d = tsToDate(f.recordedAt);
      if(!groups[d]){ groups[d] = []; order.push(d); }
      groups[d].push(f);
    });
    order.sort(function(a, b){ return b.localeCompare(a); });

    var chips = FEED_TYPES.map(function(t){
      return '<button type="button" class="chip' + (state.feedingType === t.v ? ' sel' : '') + '" data-ft="' + t.v + '">' + t.i + ' ' + t.n + '</button>';
    }).join('');

    var chartBtns = CHART_TYPES.map(function(ct){
      return '<button class="chart-type-btn' + (state.feedChartType === ct.v ? ' sel' : '') + '" data-ct="' + ct.v + '">' + ct.n + '</button>';
    }).join('');

    var dayHtml = order.map(function(d){
      var items = groups[d];
      var milk = items.filter(function(f){ return f.type === 'milk'; }).reduce(function(s, f){ return s + (+f.amountMl || 0); }, 0);
      var breast = items.filter(function(f){ return f.type === 'breast'; }).reduce(function(s, f){ return s + (+f.minutes || 0); }, 0);
      var diaper = items.filter(function(f){ return f.type === 'diaper'; }).reduce(function(s, f){ return s + (+f.count || 1); }, 0);
      return '<div style="margin-bottom:16px">'
        + '<div style="display:flex;align-items:center;gap:8px;margin:0 2px 8px;flex-wrap:wrap">'
        +   '<span style="font-size:13.5px;font-weight:700;color:var(--text)">' + esc(fmtDate(d)) + '</span>'
        +   (d === todayStr() ? '<span class="tag pending">今天</span>' : '')
        +   '<span style="font-size:11.5px;color:var(--text-l);margin-left:auto">奶' + milk + 'ml · 母乳' + breast + '分 · 尿布' + diaper + '次</span>'
        + '</div>'
        + items.map(function(f){
          var t = FEED_TYPE_MAP[f.type] || { n: f.type, i: '📝' };
          return '<div class="item">'
            + '<div class="item-ico">' + t.i + '</div>'
            + '<div class="item-body">'
            +   '<p class="item-title">' + esc(t.n) + ' · ' + esc(feedSummary(f)) + '</p>'
            +   '<p class="item-meta">' + esc(tsToTime(f.recordedAt)) + (f.notes ? ' · ' + esc(f.notes) : '') + '</p>'
            + '</div>'
            + '<div class="item-actions">'
            +   '<button class="icon-btn" onclick="editFeeding(\'' + f.id + '\')">✎</button>'
            +   '<button class="icon-btn del" onclick="delRecord(\'feeding\',\'' + f.id + '\')">🗑</button>'
            + '</div>'
            + '</div>';
        }).join('')
        + '</div>';
    }).join('');

    setTimeout(function(){
      var wrap = $('#feedChips');
      if(wrap){

function drawFeedChart(){
  var canvas = $('#feedChartCanvas');
  if(!canvas) return;
  var type = state.feedChartType;
  var ct = null;
  for(var i = 0; i < CHART_TYPES.length; i++){
    if(CHART_TYPES[i].v === type){ ct = CHART_TYPES[i]; break; }
  }
  if(!ct) ct = CHART_TYPES[0];

  dbByBaby('feeding', state.babyId).then(function(list){
    var days = [];
    var now = new Date();
    for(var i = 6; i >= 0; i--){
      var d = new Date(now);
      d.setDate(d.getDate() - i);
      days.push(d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()));
    }
    var dayData = days.map(function(day){
      var dayItems = list.filter(function(f){ return tsToDate(f.recordedAt) === day; });
      var val = 0;
      if(ct.mode === 'count'){
        val = dayItems.filter(function(f){ return f.type === type; }).length;
      }else{
        if(type === 'milk') val = dayItems.filter(function(f){ return f.type === 'milk'; }).reduce(function(s, f){ return s + (+f.amountMl || 0); }, 0);
        else if(type === 'breast') val = dayItems.filter(function(f){ return f.type === 'breast'; }).reduce(function(s, f){ return s + (+f.minutes || 0); }, 0);
        else if(type === 'sleep') val = dayItems.filter(function(f){ return f.type === 'sleep'; }).reduce(function(s, f){ return s + (+f.minutes || 0); }, 0);
        else if(type === 'water') val = dayItems.filter(function(f){ return f.type === 'water'; }).reduce(function(s, f){ return s + (+f.amountMl || 0); }, 0);
        else if(type === 'diaper') val = dayItems.filter(function(f){ return f.type === 'diaper'; }).reduce(function(s, f){ return s + (+f.count || 1); }, 0);
      }
      return { day: day, val: val };
    });

    var dpr = window.devicePixelRatio || 1;
    var W = canvas.clientWidth || 320;
    var H = canvas.clientHeight || 220;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    var padL = 38, padR = 10, padT = 14, padB = 30;
    var cw = W - padL - padR;
    var ch = H - padT - padB;

    var maxVal = 1;
    dayData.forEach(function(d){ if(d.val > maxVal) maxVal = d.val; });
    maxVal = Math.ceil(maxVal * 1.15);
    if(maxVal < 1) maxVal = 1;

    function X(i){ return padL + (i + 0.5) / 7 * cw; }
    function Y(v){ return padT + ch - (v / maxVal) * ch; }

    var isNight = document.body.classList.contains('night');
    ctx.strokeStyle = isNight ? '#3D362C' : '#F0E4CE';
    ctx.lineWidth = 1;
    ctx.fillStyle = isNight ? '#8B7A66' : '#A89179';
    ctx.font = '10px -apple-system, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for(var i = 0; i <= 4; i++){
      var v = maxVal * i / 4;
      var y = Y(v);
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + cw, y); ctx.stroke();
      ctx.fillText(Math.round(v), padL - 6, y);
    }

    var barW = cw / 7 * 0.52;
    dayData.forEach(function(d, i){
      var x = X(i) - barW / 2;
      var y = Y(d.val);
      var h = Y(0) - Y(d.val);
      if(h < 1) h = 1;
      var grad = ctx.createLinearGradient(0, y, 0, y + h);
      if(isNight){ grad.addColorStop(0, '#D4A876'); grad.addColorStop(1, '#8B6F47'); }
      else{ grad.addColorStop(0, '#E9C79B'); grad.addColorStop(1, '#C89B6A'); }
      ctx.fillStyle = grad;
      var r = Math.min(4, barW / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + barW - r, y);
      ctx.quadraticCurveTo(x + barW, y, x + barW, y + r);
      ctx.lineTo(x + barW, y + h);
      ctx.lineTo(x, y + h);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = isNight ? '#E8DCC8' : '#5A4A3A';
      ctx.font = 'bold 10px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      if(d.val > 0) ctx.fillText(d.val, X(i), y - 3);
      ctx.fillStyle = isNight ? '#8B7A66' : '#A89179';
      ctx.font = '9px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      var parts = d.day.split('-');
      ctx.fillText(parseInt(parts[1], 10) + '/' + parseInt(parts[2], 10), X(i), padT + ch + 6);
    });

    var total = dayData.reduce(function(s, d){ return s + d.val; }, 0);
    var avg = Math.round(total / 7 * 10) / 10;
    var todayVal = dayData[6].val;
    var summaryEl = $('#feedChartSummary');
    if(summaryEl){
      summaryEl.innerHTML = '<div class="summary-bar">'
        + '<div class="summary-chip"><div class="sc-val">' + todayVal + '</div><div class="sc-label">今日' + ct.unit + '</div></div>'
        + '<div class="summary-chip"><div class="sc-val">' + avg + '</div><div class="sc-label">日均' + ct.unit + '</div></div>'
        + '<div class="summary-chip"><div class="sc-val">' + total + '</div><div class="sc-label">7天合计' + ct.unit + '</div></div>'
        + '</div>';
    }
  });
}

var _breastTimer = null;
var _breastStart = 0;
function toggleBreastTimer(){
  var btn = $('#breastTimerBtn');
  var input = $('#breastMinutesInput');
  var hint = $('#breastTimerHint');
  if(!btn) return;
  if(_breastTimer){
    clearInterval(_breastTimer);
    _breastTimer = null;
    var elapsed = Math.round((Date.now() - _breastStart) / 60000);
    if(elapsed < 1) elapsed = 1;
    if(input) input.value = elapsed;
    btn.textContent = '▶ 开始';
    btn.className = 'btn-primary btn-sm';
    if(hint) hint.textContent = '已计时 ' + elapsed + ' 分钟，可修改';
  }else{
    _breastStart = Date.now();
    btn.textContent = '⏹ 停止';
    btn.className = 'btn-danger btn-sm';
    if(hint) hint.textContent = '计时中… 点击「停止」结束';
    _breastTimer = setInterval(function(){
      var sec = Math.round((Date.now() - _breastStart) / 1000);
      var m = Math.floor(sec / 60);
      var s = sec % 60;
      if(hint) hint.textContent = '计时中… ' + pad2(m) + ':' + pad2(s);
    }, 500);
  }
}

function bindFeedForm(mask){
  var typeInput = mask.querySelector('input[name=type]');
  var chips = mask.querySelector('#ftChips');
  function syncFields(){
    var t = typeInput.value;
    mask.querySelector('#fAmt').style.display   = ['milk','water'].indexOf(t) >= 0 ? 'block' : 'none';
    mask.querySelector('#fBreast').style.display = t === 'breast' ? 'block' : 'none';
    mask.querySelector('#fFood').style.display  = ['solid','snack'].indexOf(t) >= 0 ? 'block' : 'none';
    mask.querySelector('#fSup').style.display   = t === 'supplement' ? 'block' : 'none';
    mask.querySelector('#fSleep').style.display = t === 'sleep' ? 'block' : 'none';
    mask.querySelector('#fCnt').style.display   = t === 'diaper' ? 'block' : 'none';
    mask.querySelector('#fStool').style.display = t === 'stool' ? 'block' : 'none';
  }
  chips.querySelectorAll('.chip').forEach(function(c){
    c.onclick = function(){
      chips.querySelectorAll('.chip').forEach(function(x){ x.classList.remove('sel'); });
      c.classList.add('sel');
      typeInput.value = c.getAttribute('data-v');
      syncFields();
    };
  });
  var startEl = mask.querySelector('#sleepStart');
  var endEl = mask.querySelector('#sleepEnd');
  var durEl = mask.querySelector('#sleepDuration');
  var minEl = mask.querySelector('#sleepMinutesInput');
  function calcSleep(){
    if(!startEl || !endEl) return;
    var s = startEl.value, e = endEl.value;
    if(!s || !e){ if(durEl) durEl.textContent = '输入时间后自动计算'; return; }
    var sp = s.split(':'), ep = e.split(':');
    var sm = parseInt(sp[0], 10) * 60 + parseInt(sp[1], 10);
    var em = parseInt(ep[0], 10) * 60 + parseInt(ep[1], 10);
    var diff = em - sm;
    if(diff <= 0) diff += 24 * 60;
    if(durEl) durEl.textContent = '共 ' + diff + ' 分钟（' + Math.floor(diff / 60) + '小时' + (diff % 60) + '分）';
    if(minEl) minEl.value = diff;
  }
  if(startEl) startEl.onchange = calcSleep;
  if(endEl) endEl.onchange = calcSleep;
  if(startEl && endEl && startEl.value && endEl.value) calcSleep();

  var stoolChips = mask.querySelector('#stoolChips');
  if(stoolChips){
    stoolChips.querySelectorAll('.chip').forEach(function(c){
      c.onclick = function(){
        stoolChips.querySelectorAll('.chip').forEach(function(x){ x.classList.remove('sel'); });
        c.classList.add('sel');
        mask.querySelector('input[name=stoolShape]').value = c.getAttribute('data-v');
      };
    });
  }
}

function editFeeding(id){
  if(_breastTimer){ clearInterval(_breastTimer); _breastTimer = null; }
  (id ? dbGet('feeding', id) : Promise.resolve(null)).then(function(f){
    var m = showModal({
      title: f ? '编辑喂养记录' : '新增喂养记录',
      submitText: f ? '保存修改' : '添加记录',
      body: feedFormBody(f),
      onSubmit: function(data){
        var t = data.type;
        if(['milk','water'].indexOf(t) >= 0 && !data.amountMl){ toast('请填写用量'); return false; }
        if(['solid','snack'].indexOf(t) >= 0 && !(data.foodName || '').trim()){ toast('请填写食物名称'); return false; }
        if(t === 'supplement' && !(data.supplementName || '').trim()){ toast('请填写补剂名称'); return false; }
        var minutes = null;
        if(t === 'breast'){ if(data.breastMinutes) minutes = +data.breastMinutes; }
        else if(t === 'sleep'){ if(data.sleepMinutes) minutes = +data.sleepMinutes; }
        if(t === 'sleep' && !minutes){ toast('请填写睡眠时间'); return false; }
        if(t === 'breast' && !minutes){ toast('请填写母乳喂养时长'); return false; }
        var rec = {
          id: f ? f.id : uid(), babyId: state.babyId, type: t,
          amountMl: data.amountMl ? +data.amountMl : null,
          foodName: data.foodName ? data.foodName.trim() : '',
          supplementName: data.supplementName ? data.supplementName.trim() : '',
          minutes: minutes,
          sleepStart: t === 'sleep' ? (data.sleepStart || '') : '',
          sleepEnd: t === 'sleep' ? (data.sleepEnd || '') : '',
          count: data.count ? +data.count : 1,
          stoolShape: data.stoolShape || '',
          notes: (data.notes || '').trim(),
          recordedAt: data.recordedAt ? new Date(data.recordedAt).getTime() : Date.now(),
          createdAt: f ? f.createdAt : Date.now()
        };
        return dbPut('feeding', rec).then(function(){
          toast(f ? '已保存修改' : '记录已添加');
          if(_breastTimer){ clearInterval(_breastTimer); _breastTimer = null; }
          render();
          if(syncState.enabled && syncState.autoSync) syncNow(true);
        });
      }
    });
    setTimeout(function(){ bindFeedForm(m.el); }, 0);
  });
}

function drawGrowthChart(records){
  var canvas = $('#growthCanvas');
  if(!canvas) return;
  if(!records){
    dbByBaby('growth', state.babyId).then(function(list){ drawGrowthChart(list); });
    return;
  }
  var dpr = window.devicePixelRatio || 1;
  var W = canvas.clientWidth || 320;
  var H = canvas.clientHeight || 260;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  var ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  var metric = state.growthMetric;
  var gender = (state.baby && state.baby.gender) || 'male';
  var data = (metric === 'weight' ? WHO_WEIGHT : WHO_HEIGHT)[gender];
  var isNight = document.body.classList.contains('night');
  var padL = 40, padR = 12, padT = 14, padB = 28;
  var cw = W - padL - padR;
  var ch = H - padT - padB;
  var maxAge = 60;
  var babyPoints = records.map(function(r){
    return { age: ageMonths(state.baby.birthDate, r.measuredAt), val: metric === 'weight' ? +r.weightKg : +r.heightCm };
  }).filter(function(p){ return p.val > 0 && p.age >= 0 && p.age <= 60; });
  var yMin = Infinity, yMax = -Infinity;
  data.forEach(function(row){
    for(var i = 1; i <= 5; i++){
      if(row[i] < yMin) yMin = row[i];
      if(row[i] > yMax) yMax = row[i];
    }
  });
  babyPoints.forEach(function(p){
    if(p.val < yMin) yMin = p.val;
    if(p.val > yMax) yMax = p.val;
  });
  if(!isFinite(yMin) || !isFinite(yMax)){ yMin = 0; yMax = 10; }
  yMin = Math.floor(yMin - (yMax - yMin) * 0.06);
  yMax = Math.ceil(yMax + (yMax - yMin) * 0.06);
  function X(age){ return padL + (age / maxAge) * cw; }
  function Y(v){ return padT + ch - ((v - yMin) / (yMax - yMin)) * ch; }
  ctx.strokeStyle = isNight ? '#3D362C' : '#F0E4CE';
  ctx.lineWidth = 1;
  ctx.fillStyle = isNight ? '#8B7A66' : '#A89179';
  ctx.font = '10px -apple-system, sans-serif';
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for(var i = 0; i <= 5; i++){
    var v = yMin + (yMax - yMin) * (i / 5);
    var y = Y(v);
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + cw, y); ctx.stroke();
    ctx.fillText(v.toFixed(v >= 100 ? 0 : 1), padL - 6, y);
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  [0, 12, 24, 36, 48, 60].forEach(function(m){
    var x = X(m);
    ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + ch); ctx.stroke();
    ctx.fillText(m + '月', x, padT + ch + 6);
  });
  var pColors = ['#E0C4A0', '#CFA477', '#8B6F47', '#CFA477', '#E0C4A0'];
  var pWidths = [1.2, 1.2, 2, 1.2, 1.2];
  var pDash  = [[4,4], [4,4], [], [4,4], [4,4]];
  for(var pi = 0; pi < 5; pi++){
    ctx.beginPath();
    ctx.strokeStyle = pColors[pi];
    ctx.lineWidth = pWidths[pi];
    if(ctx.setLineDash) ctx.setLineDash(pDash[pi]);
    data.forEach(function(row, idx){
      var x = X(row[0]); var y = Y(row[pi + 1]);
      if(idx === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    if(ctx.setLineDash) ctx.setLineDash([]);
  }
  if(babyPoints.length){
    babyPoints.sort(function(a, b){ return a.age - b.age; });
    ctx.beginPath();
    ctx.strokeStyle = '#6E9B5E'; ctx.lineWidth = 2.4; ctx.lineJoin = 'round';
    babyPoints.forEach(function(p, i){
      var x = X(p.age), y = Y(p.val);
      if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    ctx.fillStyle = '#6E9B5E';
    babyPoints.forEach(function(p){
      ctx.beginPath();
      ctx.arc(X(p.age), Y(p.val), 3.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = isNight ? '#2A2620' : '#fff'; ctx.lineWidth = 1.6; ctx.stroke();
    });
  }
  if(!babyPoints.length){
    ctx.fillStyle = isNight ? '#8B7A66' : '#C4B49B';
    ctx.font = '12px -apple-system, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('添加测量记录后显示宝宝曲线', padL + cw / 2, padT + ch / 2);
  }
}
